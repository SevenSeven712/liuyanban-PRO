<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#2e7d32" />
<link rel="stylesheet" href="bubbles.css" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Seven戚 · 聊天群</title>
<script src="./vendor/supabase.js"></script>
<script>window.supabase||document.write('<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"><\/script>');</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
:root{--bg:#f5faf5;--bg-card:#fff;--bg-input:#eaf3ea;--border:#c8e0c8;--text:#1e3a2e;--text-muted:#5a7a6a;--primary:#2e7d32;--primary-light:#4caf50;--primary-bg:#e8f5e9;--shadow:0 8px 32px rgba(46,125,50,.12);--radius:16px;--radius-sm:10px;--font:"Space Grotesk","PingFang SC","Segoe UI",system-ui,sans-serif;--danger:#e57373;--success:#22c55e;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden}
#mainApp{display:flex;flex-direction:column;height:100vh;height:100dvh;background:var(--bg)}
.app-header{flex-shrink:0;padding:12px 16px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;min-height:56px;z-index:50;gap:8px}
.app-header .brand{font-weight:900;font-size:1.05em;display:flex;align-items:center;gap:.35em;cursor:pointer;white-space:nowrap}
.app-header .brand span{color:var(--primary)}
.app-header .brand small{font-weight:400;font-size:.55em;color:var(--text-muted);margin-left:.3em}
.header-right{display:flex;align-items:center;gap:4px;flex-shrink:0}
.user-area{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 8px 4px 4px;border-radius:99px}
.user-area:hover{background:var(--primary-bg)}
.user-area .avatar{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0;background-size:cover;background-position:center}
.user-area .user-name{font-weight:600;font-size:.8em;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots-btn{background:none;border:none;cursor:pointer;padding:6px;border-radius:50%;display:grid;place-items:center;color:var(--text-muted);flex-shrink:0;position:relative}
.dots-btn svg{width:22px;height:22px;fill:currentColor}
.app-tabs{flex-shrink:0;display:flex;background:rgba(255,255,255,.96);border-top:1px solid var(--border);padding:6px 0 calc(6px + var(--safe-b));z-index:50}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;font-family:var(--font);font-size:.6em;font-weight:600;color:var(--text-muted);padding:4px 0;cursor:pointer;text-decoration:none;position:relative}
.tab-btn .tab-icon{font-size:1.6em;line-height:1.2;display:flex;align-items:center;justify-content:center;width:1.7em;height:1.7em}
.tab-btn .tab-icon svg{width:100%;height:100%;display:block;stroke:currentColor;fill:none}
.tab-btn.active{color:var(--primary)}
.tab-btn.active::after{content:'';position:absolute;top:-1px;left:30%;right:30%;height:3px;background:var(--primary);border-radius:0 0 4px 4px}
.app-content{flex:1;min-height:0;display:flex;flex-direction:column}
.chat-messages{flex:1;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}

.row{display:flex;align-items:flex-start;gap:8px;max-width:85%;}
.row.other{align-self:flex-start;}
.row.self{align-self:flex-end;flex-direction:row-reverse;}
.row .avatar{width:38px;height:38px;border-radius:50%;flex-shrink:0;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;cursor:pointer;background-size:cover;background-position:center;overflow:hidden;}
.row .bubble-wrap{display:flex;flex-direction:column;cursor:pointer;min-width:0;align-items:flex-start;}
.row.self .bubble-wrap{align-items:flex-end;}
.row .bubble{padding:10px 14px;font-size:.88em;line-height:1.5;word-break:break-word;position:relative;background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.1);}
.row.self .bubble{background:#95ec69;color:#1a1a1a;}
.row .uname{font-size:.68em;color:var(--text-muted);margin-bottom:3px;display:flex;align-items:center;gap:6px;}
.row.self .uname{flex-direction:row-reverse;text-align:right;}

.rp-card{display:block;max-width:230px;background:linear-gradient(135deg,#ff7043,#e64a19);border-radius:14px;padding:12px 16px;color:#fff;cursor:pointer;box-shadow:0 6px 18px rgba(230,74,25,.3);transition:transform .15s;}
.rp-card:active{transform:scale(.97)}
.rp-card.grabbed{background:linear-gradient(135deg,#9e9e9e,#757575);box-shadow:none;cursor:default;}
.rp-card.done{background:linear-gradient(135deg,#bdbdbd,#9e9e9e);box-shadow:none;cursor:default;}
.rp-card .rp-top{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.88em;}
.rp-card .rp-amt{font-size:1.4em;font-weight:900;margin-top:4px;}
.rp-card .rp-sub{font-size:.7em;opacity:.9;margin-top:4px;}

.pill-bar{flex-shrink:0;display:flex;gap:8px;align-items:center;padding:8px 16px 0;overflow-x:auto;background:var(--bg)}
.pill-btn{position:relative;display:inline-flex;align-items:center;gap:6px;padding:8px 22px;border-radius:999px;border:2px solid var(--border);background:var(--bg-card);color:var(--text);font-family:inherit;font-weight:700;font-size:.8em;cursor:pointer;white-space:nowrap;transition:.2s}
.fixed-input-area{flex-shrink:0;padding:10px 16px calc(10px + var(--safe-b));background:var(--bg);border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fixed-input-area .input-wrapper{flex:1;display:flex;gap:8px;min-width:0}
.fixed-input-area input{flex:1;padding:10px 14px;border-radius:99px;border:2px solid var(--border);background:var(--bg-input);font-family:inherit;font-size:.85em;outline:none;min-width:0;color:var(--text)}
.fixed-input-area button{padding:8px 18px;border-radius:99px;border:none;background:var(--primary);color:#fff;font-weight:700;font-size:.85em;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;font-family:inherit}
.fixed-input-area .red-packet-btn{background:linear-gradient(135deg,#ff7043,#e64a19);}

.rp-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:998;opacity:0;pointer-events:none;transition:opacity .3s;}
.rp-backdrop.open{opacity:1;pointer-events:auto;}
.rp-sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg-card);border-radius:20px 20px 0 0;z-index:999;padding:8px 20px calc(20px + var(--safe-b));transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);max-height:82vh;overflow-y:auto;}
.rp-sheet.open{transform:translateY(0);}
.rp-handle{width:40px;height:4px;background:var(--border);border-radius:99px;margin:6px auto 14px;}
.rp-title{font-weight:800;font-size:1.05em;margin-bottom:16px;}
.rp-field{margin-bottom:14px;}
.rp-field label{display:block;font-size:.72em;font-weight:600;color:var(--text-muted);margin-bottom:6px;}
.rp-field input,.rp-field select{width:100%;padding:11px 14px;border:2px solid var(--border);border-radius:10px;font-family:inherit;font-size:1em;outline:none;box-sizing:border-box;background:var(--bg-input);color:var(--text);}
.rp-type-row{display:flex;gap:8px;}
.rp-type{flex:1;padding:9px;border-radius:10px;border:2px solid var(--border);background:#fff;color:var(--text-muted);font-weight:700;font-size:.82em;cursor:pointer;font-family:inherit;}
.rp-type.active{border-color:var(--primary);background:var(--primary-bg);color:var(--primary);}
.rp-send{width:100%;padding:13px;border-radius:10px;border:none;background:var(--primary);color:#fff;font-weight:700;font-size:1em;cursor:pointer;font-family:inherit;margin-top:6px;}
.rp-rank-item{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:8px;background:var(--bg-input);margin-bottom:6px;font-size:.85em;}
.rp-rank-item .rr-left{display:flex;align-items:center;gap:10px;}
.rp-rank-item .rr-no{width:20px;text-align:center;font-weight:800;color:var(--text-muted);}
.rp-rank-item .rr-no.top1{color:#e6a700;}
.rp-rank-item .rr-amt{font-weight:800;color:var(--primary);}

#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:.7em 1.5em;border-radius:2em;font-weight:600;font-size:.85em;opacity:0;transition:all .4s ease;z-index:9999;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow);max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.online-overlay{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s}
.online-overlay.open{transform:translateX(0)}
.online-header{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-t)) 14px 10px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--border);min-height:56px}
.online-header .back{background:none;border:none;cursor:pointer;padding:4px;color:var(--text);display:flex}
.online-header .back svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.online-header .title{font-weight:700;font-size:1em;flex:1}
.online-body{flex:1;overflow-y:auto;padding:16px;}
.online-user{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:10px;}
.online-user .ou-avatar{width:42px;height:42px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px;flex-shrink:0;background-size:cover;background-position:center}
.online-user .ou-name{font-weight:700;font-size:.92em;}
</style>
</head>
<body>
<div id="mainApp">
  <div id="header-container"></div>
  <div class="app-content">
    <div class="chat-messages" id="chatMessages"></div>
    <div class="pill-bar">
      <button class="pill-btn" onclick="location.href='./room.html'">房间</button>
    </div>
    <div class="fixed-input-area">
      <button id="chatRedPacketBtn" class="red-packet-btn">
        <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:#fff;"><rect x="3" y="2" width="18" height="20" rx="2"/><path d="M3 5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2c-2.5 1.5-5.5 2.5-9 2.5S5.5 8.5 3 7V5Z" style="fill:#ffe082"/><circle cx="12" cy="15" r="2.5" style="fill:#e53935"/><rect x="11.2" y="14.2" width="1.6" height="1.6" style="fill:#fff"/></svg>
        红包
      </button>
      <div class="input-wrapper">
        <input type="text" id="chatInput" placeholder="说点什么…" maxlength="200" />
        <button id="sendChatBtn">
          <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          发送
        </button>
      </div>
    </div>
  </div>
  <div id="footer-container"></div>
</div>

<div class="rp-backdrop" id="rpBackdrop"></div>
<div class="rp-sheet" id="rpSheet">
  <div class="rp-handle"></div>
  <div class="rp-title">发红包</div>
  <div class="rp-field">
    <label>红包总积分</label>
    <input type="number" id="crpTotal" placeholder="如 100" min="1" />
  </div>
  <div class="rp-field">
    <label>类型</label>
    <div class="rp-type-row">
      <button type="button" class="rp-type active" data-t="group">拼手气（群红包）</button>
      <button type="button" class="rp-type" data-t="exclusive">专属红包</button>
    </div>
  </div>
  <div class="rp-field" id="crpCountField">
    <label>可领份数（至少 2 份）</label>
    <input type="number" id="crpCount" placeholder="如 5" min="2" />
  </div>
  <div class="rp-field" id="crpTargetField" style="display:none;">
    <label>指定领取人（在线用户）</label>
    <select id="crpTarget"></select>
  </div>
  <button class="rp-send" id="crpSendBtn">塞钱进红包</button>
</div>

<div class="rp-backdrop" id="rpDetailBackdrop"></div>
<div class="rp-sheet" id="rpDetailSheet">
  <div class="rp-handle"></div>
  <div class="rp-title" style="display:flex;justify-content:space-between;align-items:center;">红包详情
    <button id="rpDetailClose" style="background:none;border:none;cursor:pointer;color:var(--text-muted);padding:4px;">✕</button>
  </div>
  <div id="rpDetailBody" style="padding:0 4px 20px;"></div>
</div>

<div class="online-overlay" id="onlineOverlay">
  <div class="online-header">
    <button class="back" id="onlineBackBtn"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
    <span class="title">在线用户</span>
  </div>
  <div class="online-body"><div class="online-list" id="onlineUserList"></div></div>
</div>

<div id="toast"></div>
<script src="./common.js"></script>
<script>
var currentUser = getSessionUser();
if(!currentUser || !currentUser.id) window.location.href='./index.html';

function showToast(m){var t=document.getElementById('toast');if(!t)return;t.textContent=m;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(function(){t.classList.remove('show')},2600)}
function safeUrl(u){if(!u)return '';var s=String(u).trim();if(!/^https?:\/\//.test(s))return '';return escapeHtml(s);}

function renderHeaderUI(){
  var u=currentUser||{},name=u.nickname||'用户';
  var has=u.avatar_url&&String(u.avatar_url).indexOf('http')===0;
  document.getElementById('header-container').innerHTML=
    '<div class="app-header">'+
      '<div class="brand" onclick="window.location.href=\'./posts.html\'">Seven<span>戚</span><small>· 聊天群</small></div>'+
      '<div class="header-right">'+
        '<div class="user-area" onclick="window.location.href=\'./user.html\'">'+
          '<div class="avatar" style="'+(has?'background-image:url(\''+safeUrl(u.avatar_url)+'\');background-size:cover;background-position:center;':'')+'">'+(has?'':escapeHtml(name.charAt(0).toUpperCase()))+'</div>'+
          '<span class="user-name">'+escapeHtml(name)+'</span>'+
        '</div>'+
        '<button class="dots-btn" id="dotsBtn" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg><span class="online-badge" id="onlineBadge" style="display:none;">0</span></button>'+
      '</div>'+
    '</div>';
  document.getElementById('dotsBtn').onclick=function(){
    document.getElementById('onlineOverlay').classList.add('open');
    renderOnlineUsers();
  };
}
renderHeaderUI();
renderFooter('chats');

var onlineUsers={}, onlineChannel=null;
function renderOnlineUsers(){
  var c=document.getElementById('onlineUserList'); if(!c)return;
  var others=[]; Object.keys(onlineUsers).forEach(function(k){ if(onlineUsers[k].id!==currentUser.id) others.push(onlineUsers[k]); });
  var badge=document.getElementById('onlineBadge');
  if(badge){ if(others.length>0){badge.textContent=others.length>99?'99+':others.length;badge.style.display='inline-block';}else{badge.style.display='none';} }
  if(!others.length){ c.innerHTML='<div style="text-align:center;color:var(--text-muted);padding:20px;">暂无在线用户</div>'; return; }
  c.innerHTML = others.map(function(u){
    var has=u.avatar_url&&String(u.avatar_url).indexOf('http')===0;
    return '<div class="online-user"><div class="ou-avatar" style="'+(has?'background-image:url(\''+safeUrl(u.avatar_url)+'\');background-size:cover;background-position:center;':'')+'">'+(has?'':escapeHtml(String(u.nickname||'U').charAt(0).toUpperCase()))+'</div><div class="ou-name">'+escapeHtml(u.nickname||'用户')+'</div></div>';
  }).join('');
}
function initPresence(){
  if(onlineChannel){try{window.sb.removeChannel(onlineChannel)}catch(e){}onlineChannel=null}
  onlineChannel=window.sb.channel('sq-chat-online',{config:{presence:{key:currentUser.id}}});
  onlineChannel.on('presence',{event:'sync'},function(){
    var raw=onlineChannel.presenceState(),map={};
    Object.keys(raw).forEach(function(key){
      var arr=raw[key]; if(!arr||!arr.length)return;
      var p=arr[0], uid=p.user_id||key;
      map[uid]={id:uid,nickname:p.nickname||'用户',avatar_url:p.avatar_url||''};
    });
    onlineUsers=map; renderOnlineUsers();
  });
  onlineChannel.subscribe(function(status){
    if(status==='SUBSCRIBED'){
      onlineChannel.track({user_id:currentUser.id,nickname:currentUser.nickname,avatar_url:currentUser.avatar_url||'',online_at:new Date().toISOString()});
    }else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){ setTimeout(initPresence,3000); }
  });
}
document.getElementById('onlineBackBtn').onclick=function(){document.getElementById('onlineOverlay').classList.remove('open');};

var chats=[], rpList=[], myGrabs={}, usersCache={}, currentBubbleSkin=0;

async function loadBubbleSkin(){
  try {
    var u = await window.sb.rpc('get_my_profile');
    var d = (u && u.data) ? (Array.isArray(u.data) ? u.data[0] : u.data) : null;
    if (d && typeof d.bubble_skin === 'number') currentBubbleSkin = d.bubble_skin;
  } catch(e) {}
}

async function fetchChats(){
  var res=await window.sb.from('chats').select('*').order('created_at',{ascending:true});
  if(res.error)throw res.error;
  var data=res.data||[];
  try{
    var pr=await window.sb.from('public_profiles').select('id, nickname, avatar_url');
    if(!pr.error){ (pr.data||[]).forEach(function(u){ usersCache[u.id]=u; }); }
  }catch(e){}
  return data;
}
async function loadChatRedPackets(){
  try{
    var res = await window.sb.from('red_packets').select('*').eq('scope', 'chat').order('created_at', { ascending: false }).limit(20);
    if(res.error) throw res.error;
    rpList = res.data || [];
    await loadChatMyGrabs();
  }catch(e){ rpList = []; }
}
async function loadChatMyGrabs(){
  myGrabs = {};
  if(!rpList.length) return;
  try{
    var ids = rpList.map(function(p){ return p.id; });
    var res = await window.sb.from('red_packet_grabs').select('packet_id, amount').eq('user_id', currentUser.id).in('packet_id', ids);
    (res.data || []).forEach(function(g){ myGrabs[g.packet_id] = g.amount; });
  }catch(e){}
}
function renderChat(){
  var container=document.getElementById('chatMessages');
  if(!chats.length && !rpList.length){container.innerHTML='<div style="text-align:center;padding:20px;color:var(--text-muted);">还没有聊天消息</div>';return}
  var merged = [];
  chats.forEach(function(c){ merged.push({ kind:'chat', t:new Date(c.created_at).getTime(), data:c }); });
  rpList.forEach(function(p){ merged.push({ kind:'rp', t:new Date(p.created_at).getTime(), data:p }); });
  merged.sort(function(a,b){ return a.t - b.t; });
  var skinCls = 'b' + currentBubbleSkin;
  var html='';
  merged.forEach(function(item){
    var isSelf, name, avatarUrl;
    if(item.kind === 'chat') {
      var c = item.data;
      isSelf = currentUser && c.user_id === currentUser.id;
      var ui = usersCache[c.user_id] || null;
      name = ui ? ui.nickname : c.author;
      avatarUrl = ui ? ui.avatar_url : null;
      var av = (avatarUrl && String(avatarUrl).indexOf('http')===0) ? '<div class="avatar" style="background-image:url(\''+safeUrl(avatarUrl)+'\');background-size:cover;background-position:center;"></div>' : '<div class="avatar">'+escapeHtml(String(name).charAt(0).toUpperCase())+'</div>';
      var rowCls = 'row ' + (isSelf ? 'self' : 'other') + (isSelf ? ' ' + skinCls : '');
      html+='<div class="'+rowCls+'">'+av+'<div class="bubble-wrap"><div class="uname">'+escapeHtml(name)+'</div><div class="bubble">'+escapeHtml(c.content)+'</div></div></div>';
    } else {
      var p = item.data;
      isSelf = currentUser && p.sender_id === currentUser.id;
      var rpUi = usersCache[p.sender_id] || null;
      name = rpUi ? rpUi.nickname : p.sender_name;
      avatarUrl = rpUi ? rpUi.avatar_url : null;
      var mine = myGrabs[p.id];
      var finished = p.remaining_count <= 0;
      var isEx = !!p.target_user_id;
      var rpCls = (isEx?'exclusive ':'') + (mine!==undefined?'grabbed':(finished?'done':''));
      var sub = '';
      if(mine !== undefined) sub = isEx ? '专属红包 · 你已领取' : '你已领取 · 看看手气';
      else if(finished) sub = '手慢了，红包已领完';
      else if(isEx) sub = (p.target_user_id === currentUser.id) ? '专属红包 · 点击领取' : '专属红包（非指定人无法领取）';
      else sub = '剩余 ' + p.remaining_count + '/' + p.count + ' 份';
      var av = (avatarUrl && String(avatarUrl).indexOf('http')===0) ? '<div class="avatar" style="background-image:url(\''+safeUrl(avatarUrl)+'\');background-size:cover;background-position:center;"></div>' : '<div class="avatar">'+escapeHtml(String(name).charAt(0).toUpperCase())+'</div>';
      html += '<div class="row '+(isSelf?'self':'other')+'">'+av+'<div class="bubble-wrap"><div class="uname">'+escapeHtml(name)+'</div><div class="rp-card '+rpCls+'" data-rp="'+p.id+'" onclick="openChatRedPacket(\''+p.id+'\')"><div class="rp-top"><svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:#fff;"><rect x="3" y="2" width="18" height="20" rx="2"/><path d="M3 5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2c-2.5 1.5-5.5 2.5-9 2.5S5.5 8.5 3 7V5Z" style="fill:#ffe082"/><circle cx="12" cy="15" r="2.5" style="fill:#e53935"/><rect x="11.2" y="14.2" width="1.6" height="1.6" style="fill:#fff"/></svg>'+(isEx?'专属红包':'拼手气红包') + '</div>'+(mine !== undefined ? '<div class="rp-amt">'+mine+' 币</div>' : '')+'<div class="rp-sub">'+sub+'</div></div></div></div>';
    }
  });
  container.innerHTML=html;
  container.scrollTop=container.scrollHeight;
}
async function loadAllChats(){
  try{
    chats = await fetchChats();
    await loadChatRedPackets();
  }catch(e){ showToast('数据加载失败') }
  renderChat();
}
async function sendChat(){
  var input=document.getElementById('chatInput'),content=input.value.trim();
  if(!content){showToast('请输入内容');return}
  var btn=document.getElementById('sendChatBtn'); btn.disabled=true;
  try {
    await window.sb.from('chats').insert([{user_id:currentUser.id,author:currentUser.nickname,content:content}]);
    input.value=''; loadAllChats();
  } catch(e) { showToast('发送失败：'+e.message); } finally { btn.disabled=false; }
}

var crpType = 'group';
document.getElementById('chatRedPacketBtn').onclick = function(){
  document.getElementById('crpTotal').value = '';
  document.getElementById('crpCount').value = '';
  syncCrpTypeUI();
  buildCrpTargetOptions();
  document.getElementById('rpBackdrop').classList.add('open');
  document.getElementById('rpSheet').classList.add('open');
};
document.getElementById('rpBackdrop').onclick = function(){ this.classList.remove('open'); document.getElementById('rpSheet').classList.remove('open'); };
function syncCrpTypeUI(){
  document.querySelectorAll('.rp-type').forEach(function(b){ b.classList.toggle('active', b.dataset.t === crpType); });
  document.getElementById('crpCountField').style.display = crpType === 'group' ? 'block' : 'none';
  document.getElementById('crpTargetField').style.display = crpType === 'exclusive' ? 'block' : 'none';
}
document.querySelectorAll('.rp-type').forEach(function(b){
  b.onclick = function(){ crpType = this.dataset.t; syncCrpTypeUI(); };
});
function buildCrpTargetOptions(){
  var sel = document.getElementById('crpTarget');
  var opts = ['<option value="">请选择在线用户</option>'];
  Object.keys(onlineUsers).forEach(function(k){
    var u = onlineUsers[k];
    if(u.id === currentUser.id) return;
    opts.push('<option value="' + u.id + '">' + escapeHtml(u.nickname || '用户') + '</option>');
  });
  sel.innerHTML = opts.join('');
}
document.getElementById('crpSendBtn').onclick = async function(){
  var total = parseInt(document.getElementById('crpTotal').value, 10);
  if(!total || total < 1){ showToast('请输入红包总积分'); return; }
  var count, target = null;
  if(crpType === 'exclusive'){
    target = document.getElementById('crpTarget').value;
    if(!target){ showToast('请选择指定领取人'); return; }
    count = 1;
  } else {
    count = parseInt(document.getElementById('crpCount').value, 10);
    if(!count || count < 2){ showToast('份数至少 2 份'); return; }
    if(count > total){ showToast('份数不能超过总积分'); return; }
  }
  this.disabled = true;
  try{
    var res = await window.sb.rpc('send_red_packet', { p_room_id: null, p_total: total, p_count: count, p_scope: 'chat', p_target_user_id: target });
    if(res.error) throw res.error;
    var d = res.data;
    if(!d || !d.ok){ showToast((d && d.message) || '发送失败'); return; }
    showToast('红包已发出');
    document.getElementById('rpBackdrop').classList.remove('open');
    document.getElementById('rpSheet').classList.remove('open');
    await loadAllChats();
  }catch(e){ showToast('发送失败：' + e.message); } finally { this.disabled = false; }
};

async function openChatRedPacket(packetId){
  var p = rpList.find(function(x){ return String(x.id) === String(packetId); });
  if(!p) return;
  var mine = myGrabs[p.id];
  if(mine === undefined && p.remaining_count > 0 && p.sender_id !== currentUser.id) {
    if(p.target_user_id && p.target_user_id !== currentUser.id) { showToast('这是专属红包，你无法领取'); return; }
    try{
      var res = await window.sb.rpc('grab_red_packet', { p_packet_id: p.id });
      if(res.error) throw res.error;
      var d = res.data;
      if(d && d.ok){
        showToast('手气不错，抢到 ' + d.amount + ' 币！');
        try{ var u = await window.sb.rpc('get_my_profile'); if(u.data){ currentUser.coins = u.data.coins; setSessionUser(currentUser); } }catch(e){}
        await loadAllChats();
        p = rpList.find(function(x){ return String(x.id) === String(packetId); }) || p;
        mine = myGrabs[p.id];
      } else {
        showToast((d && d.message) || '领取失败');
        await loadAllChats(); return;
      }
    }catch(e){ showToast('领取失败：' + e.message); return; }
  }
  showChatRedPacketDetail(p, mine);
}

async function showChatRedPacketDetail(p, myAmount){
  var body = document.getElementById('rpDetailBody');
  body.innerHTML = '<div style="text-align:center;color:var(--text-muted);font-size:.85em;padding:20px;">加载中…</div>';
  document.getElementById('rpDetailBackdrop').classList.add('open');
  document.getElementById('rpDetailSheet').classList.add('open');
  try{
    var res = await window.sb.from('red_packet_grabs').select('*').eq('packet_id', p.id).order('amount', { ascending: false });
    var rows = res.data || [];
    var html = '<div style="text-align:center;margin-bottom:18px;">' +
      '<div style="font-size:.8em;color:var(--text-muted);">' + escapeHtml(p.sender_name || '匿名') + (p.target_user_id ? ' 的专属红包' : ' 的红包') + '</div>' +
      '<div style="font-size:1.6em;font-weight:900;color:var(--primary);margin-top:4px;">' + p.total + ' 币</div>' +
      '<div style="font-size:.75em;color:var(--text-light);margin-top:4px;">共 ' + p.count + ' 份 · 已领 ' + rows.length + ' 份</div>';
    if(myAmount !== undefined) html += '<div style="margin-top:10px;font-size:.85em;font-weight:700;color:var(--primary);">你领到 ' + myAmount + ' 币</div>';
    html += '</div>';
    if(rows.length){
      html += '<div style="font-size:.72em;font-weight:700;color:var(--text-muted);margin-bottom:8px;">领取排行榜</div>';
      html += rows.map(function(g, i){
        var noCls = i === 0 ? 'top1' : '';
        return '<div class="rp-rank-item"><div class="rr-left"><span class="rr-no ' + noCls + '">' + (i+1) + '</span><span>' + escapeHtml(g.user_name || '用户') + '</span></div><span class="rr-amt">' + g.amount + ' 币</span></div>';
      }).join('');
      if(rows[0]) html += '<div style="font-size:.72em;color:var(--text-light);margin-top:8px;text-align:center;">🏆 手气最佳：' + escapeHtml(rows[0].user_name || '用户') + '（' + rows[0].amount + ' 币）</div>';
    } else {
      html += '<div style="text-align:center;color:var(--text-muted);font-size:.85em;padding:20px;">还没有人领取</div>';
    }
    body.innerHTML = html;
  }catch(e){
    body.innerHTML = '<div style="text-align:center;color:var(--text-muted);font-size:.85em;padding:20px;">加载失败：' + escapeHtml(e.message) + '</div>';
  }
}
document.getElementById('rpDetailClose').onclick = function() {
  document.getElementById('rpDetailBackdrop').classList.remove('open');
  document.getElementById('rpDetailSheet').classList.remove('open');
};
document.getElementById('rpDetailBackdrop').onclick = function() {
  document.getElementById('rpDetailBackdrop').classList.remove('open');
  document.getElementById('rpDetailSheet').classList.remove('open');
};

document.getElementById('sendChatBtn').onclick = sendChat;
document.getElementById('chatInput').onkeydown = function(e){ if(e.key==='Enter') sendChat(); };

loadBubbleSkin().then(function(){ loadAllChats(); });
initPresence();
</script>
