<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#65A30D" />
<link rel="apple-touch-icon" href="./icon.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Seven戚 · 帖子广场</title>
<link rel="stylesheet" href="./theme.css" />
<script src="./vendor/supabase.js"></script>
<script>window.supabase||document.write('<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"><\/script>');</script>
<script src="./vendor/purify.min.js"></script>
<script>window.DOMPurify||document.write('<script src="https://unpkg.com/dompurify@3/dist/purify.min.js"><\/script>');</script>
<style>
.banned-banner{flex-shrink:0;background:var(--danger-bg);color:var(--danger);padding:8px 16px;font-size:0.8em;font-weight:600;text-align:center;border-bottom:1px solid #FECACA;display:none;transition:var(--transition-smooth);}
.banned-banner.active{display:block}
.app-content{flex:1;min-height:0;overflow-y:auto;padding:20px 16px;}

.posts-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.posts-header .left{display:flex;gap:8px;align-items:center;overflow-x:auto;max-width:100%;scrollbar-width:none;}
.posts-header .left::-webkit-scrollbar{display:none}
.category-btn{padding:6px 16px;border-radius:var(--radius-pill);border:1px solid var(--border-subtle);background:var(--bg-surface);color:var(--text-muted);font-size:0.8em;font-weight:600;cursor:pointer;white-space:nowrap;transition:var(--transition-smooth);}
.category-btn.active{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 2px 8px rgba(132,204,22,0.3);}
.new-post-btn{padding:8px 20px;border-radius:var(--radius-pill);border:none;background:var(--brand);color:#fff;font-weight:600;font-size:0.85em;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:4px;transition:var(--transition-smooth);}
.new-post-btn:hover{background:var(--brand-light);transform:translateY(-1px)}
.floating-post-btn{position:fixed;bottom:90px;right:20px;z-index:1000;width:56px;height:56px;border-radius:50%;background:var(--brand);color:#fff;border:none;box-shadow:0 8px 24px rgba(132,204,22,0.4);display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;transition:var(--transition-smooth);}
.floating-post-btn:hover{transform:translateY(-4px) scale(1.05);background:var(--brand-light);}
.floating-post-btn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

.post-card{background:var(--bg-surface);border-radius:var(--radius-md);padding:16px;margin-bottom:12px;border:1px solid var(--border);cursor:pointer;box-shadow:var(--shadow-sm);transition:var(--transition-smooth);}
.post-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.post-card .post-author{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.post-card .post-author .avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:15px;color:var(--brand-dark);background:var(--brand-bg);background-size:cover;background-position:center;}
.post-card .post-author .name{font-weight:600;font-size:.95em;color:var(--text);}
.post-card .post-author .official-tag{ background:#EFF6FF; color:#2563EB; font-size:.6em; padding:2px 8px; border-radius:var(--radius-pill); font-weight:600; border:1px solid #BFDBFE; }
.post-card .post-author .category-tag{background:var(--bg);color:var(--text-muted);font-size:.6em;font-weight:600;padding:2px 8px;border-radius:var(--radius-pill);border:1px solid var(--border);}
.post-card .post-author .time{font-size:.75em;color:var(--text-light);margin-left:auto;}
.post-card .post-title{font-weight:700;font-size:1.05em;margin:4px 0 6px 0;color:var(--text);}
.post-card .post-content{font-size:.88em;color:var(--text-muted);line-height:1.6;margin-bottom:10px;word-break:break-word;}
.post-card .post-content img{max-width:100%;border-radius:var(--radius-sm);margin:8px 0}
.post-card .post-content.clamped{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}

.empty-state{text-align:center;color:var(--text-muted);padding:40px 20px;font-size:.9em}
.loading-state{text-align:center;padding:40px 20px}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

.detail-overlay{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:999}
.detail-overlay.active{display:flex;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.detail-header{display:flex;align-items:center;padding:12px 16px;background:var(--bg-glass);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);flex-shrink:0;gap:8px;position:sticky;top:0;z-index:10;}
.detail-header .back-btn{background:none;border:none;cursor:pointer;padding:6px;color:var(--text);display:flex;border-radius:8px;}
.detail-header .back-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.detail-content{flex:1;overflow-y:auto;padding:20px 16px}
.detail-post{background:var(--bg-surface);border-radius:var(--radius-md);padding:20px;margin-bottom:20px;border:1px solid var(--border);box-shadow:var(--shadow-sm);}
.detail-post .post-author{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.detail-post .post-author .avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:16px;color:var(--brand-dark);background:var(--brand-bg);background-size:cover;background-position:center;}
.detail-post .post-author .name{font-weight:600;font-size:1em;color:var(--text);}
.detail-post .post-author .time{font-size:.8em;color:var(--text-light);margin-left:auto;}
.detail-post .post-title{font-weight:700;font-size:1.2em;margin:8px 0 12px 0;color:var(--text);}
.detail-post .post-content{font-size:1em;color:var(--text);line-height:1.7;word-break:break-word;}

.detail-comments{flex:1;margin-top:12px;display:flex;flex-direction:column;background:var(--bg-surface);border-radius:var(--radius-md);border:1px solid var(--border);padding:0 16px;box-shadow:var(--shadow-sm);}
.comment-item{display:flex;gap:12px;padding:16px 0;border-bottom:1px solid var(--border-subtle);}
.comment-item:last-child{border-bottom:none;}
.comment-item .avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;color:var(--brand-dark);background:var(--brand-bg);background-size:cover;background-position:center;}
.comment-item .body{flex:1}
.comment-item .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.comment-item .meta .name{font-weight:600;font-size:.9em;color:var(--text-muted);}
.comment-item .meta .time{font-size:.7em;color:var(--text-light)}
.comment-item .txt{font-size:.9em;line-height:1.6;color:var(--text);margin-top:4px;}
.comment-children { margin-left: 30px; background: var(--bg); padding: 10px 14px; border-radius: 8px; margin-top: 8px; }

.detail-input-area{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg-surface);border-top:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;z-index:10;}
.detail-input-area input{flex:1;padding:12px 16px;border-radius:var(--radius-pill);border:1px solid var(--border-subtle);background:var(--bg);font-family:inherit;font-size:.9em;outline:none;}
.detail-input-area button{padding:12px 24px;border-radius:var(--radius-pill);border:none;background:var(--brand);color:#fff;font-weight:600;cursor:pointer;font-family:inherit;}
#cancelReplyBtn { display: none; background: var(--bg); border: 1px solid var(--border); padding: 6px 12px; border-radius: 99px; font-size: 0.8em; color: var(--text-muted); cursor: pointer; margin-right: 8px; }
</style>
</head>
<body>
<div id="mainApp">
<div id="header-container"></div>
<div class="banned-banner" id="bannedBanner">账号已被封禁，无法发布新帖或评论。解封时间：<span id="bannedUntilDisplay"></span></div>
<div class="app-content" id="postContent">
  <div class="posts-header">
    <div class="left" id="categoryFilter"><button class="category-btn active" data-cat="全部" onclick="setCategory('全部', this)">全部</button></div>
    <div style="display:flex;gap:8px;">
      <button class="new-post-btn" id="adminPanelBtn" style="display:none;background:#64748B;color:#fff;box-shadow:0 2px 8px rgba(100,116,139,0.25);" onclick="openAdminPanel()">管理</button>
      <a href="./new-post.html" class="new-post-btn" id="newPostBtn">发帖</a>
    </div>
  </div>
  <div id="postList"></div>
</div>
<div id="footer-container"></div>
</div>

<a href="./new-post.html" class="floating-post-btn" id="floatingPostBtn">
  <svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg>
</a>

<div class="detail-overlay" id="detailOverlay">
  <div style="display:flex;flex-direction:column;height:100%;">
    <div class="detail-header">
      <button class="back-btn" id="closeDetail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
      <span style="font-weight:700;font-size:1.05em;">帖子详情</span>
    </div>
    <div class="detail-content" id="detailContent"></div>
    <div class="detail-input-area">
      <button id="cancelReplyBtn">取消回复</button>
      <input type="text" id="detailCommentInput" placeholder="写评论…" maxlength="200" />
      <button id="detailSendCommentBtn">发送</button>
    </div>
  </div>
</div>

<script src="./common.js"></script>
<script>
// 自定义 UI 弹窗
window.showCustomConfirm = function(title, desc) {
  return new Promise(function(resolve) {
    var mask = document.createElement('div');
    mask.style.cssText = 'position:fixed;inset:0;background:rgba(17,24,39,0.4);backdrop-filter:blur(4px);z-index:99999;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;';
    mask.innerHTML = '<div style="background:#fff;border-radius:16px;width:80%;max-width:320px;padding:24px;text-align:center;transform:scale(.9);transition:transform .2s;box-shadow:0 20px 40px rgba(0,0,0,.1);"><h3 style="margin-bottom:12px;font-size:1.1em;color:var(--text);font-weight:700;">'+title+'</h3><p style="color:var(--text-muted);margin-bottom:24px;font-size:.9em;line-height:1.6;">'+desc+'</p><div style="display:flex;gap:12px;"><button id="mc" style="flex:1;padding:12px;border-radius:99px;border:none;background:#F1F5F9;color:#64748B;font-weight:600;cursor:pointer;">取消</button><button id="mo" style="flex:1;padding:12px;border-radius:99px;border:none;background:var(--brand);color:#fff;font-weight:600;cursor:pointer;box-shadow:0 4px 12px rgba(16,185,129,0.3);">确定</button></div></div>';
    document.body.appendChild(mask);
    requestAnimationFrame(() => { mask.style.opacity = '1'; mask.children[0].style.transform = 'scale(1)'; });
    var close = function(val) { mask.style.opacity = '0'; mask.children[0].style.transform = 'scale(.9)'; setTimeout(() => { document.body.removeChild(mask); resolve(val); }, 200); };
    mask.querySelector('#mc').onclick = () => close(false);
    mask.querySelector('#mo').onclick = () => close(true);
  });
};
window.showCustomPrompt = function(title, placeholder) {
  return new Promise(function(resolve) {
    var mask = document.createElement('div');
    mask.style.cssText = 'position:fixed;inset:0;background:rgba(17,24,39,0.4);backdrop-filter:blur(4px);z-index:99999;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;';
    mask.innerHTML = '<div style="background:#fff;border-radius:16px;width:80%;max-width:320px;padding:24px;text-align:center;transform:scale(.9);transition:transform .2s;box-shadow:0 20px 40px rgba(0,0,0,.1);"><h3 style="margin-bottom:12px;font-size:1.1em;color:var(--text);font-weight:700;">'+title+'</h3><input id="pi" placeholder="'+placeholder+'" style="width:100%;padding:12px;border:1px solid #E2E8F0;border-radius:12px;margin-bottom:20px;outline:none;font-size:.9em;background:#F8FAFC;"><div style="display:flex;gap:12px;"><button id="pc" style="flex:1;padding:12px;border-radius:99px;border:none;background:#F1F5F9;color:#64748B;font-weight:600;cursor:pointer;">取消</button><button id="po" style="flex:1;padding:12px;border-radius:99px;border:none;background:var(--brand);color:#fff;font-weight:600;cursor:pointer;box-shadow:0 4px 12px rgba(16,185,129,0.3);">确定</button></div></div>';
    document.body.appendChild(mask);
    requestAnimationFrame(() => { mask.style.opacity = '1'; mask.children[0].style.transform = 'scale(1)'; mask.querySelector('#pi').focus(); });
    var close = function(val) { mask.style.opacity = '0'; mask.children[0].style.transform = 'scale(.9)'; setTimeout(() => { document.body.removeChild(mask); resolve(val); }, 200); };
    mask.querySelector('#pc').onclick = () => close(null);
    mask.querySelector('#po').onclick = () => close(mask.querySelector('#pi').value);
  });
};

var currentUser = getSessionUser();
if (!currentUser || !currentUser.id) window.location.href = './index.html';
var isAdmin = currentUser.is_admin === true;

if (isAdmin) document.getElementById('adminPanelBtn').style.display = 'inline-flex';
renderHeader('帖子广场', 'posts');
renderFooter('posts');

var categories = [], posts = [], currentCategory = '全部', commentCountMap = {}, profilesMapCache = null;

async function fetchProfilesMap(force) {
    if (!force && profilesMapCache) return profilesMapCache;
    var r = await window.sb.from('public_profiles').select('id, nickname, avatar_url');
    if (r.error) return {};
    var map = {}; (r.data || []).forEach(function(u) { map[u.id] = u; });
    profilesMapCache = map; return map;
}

function renderCategoryFilter() {
    var container = document.getElementById('categoryFilter');
    if (!container) return;
    var html = '<button class="category-btn active" data-cat="全部" onclick="setCategory(\'全部\', this)">全部</button>';
    categories.filter(function(x) { return x.name !== '未分类'; }).forEach(function(x) {
        html += '<button class="category-btn" data-cat="' + x.id + '" onclick="setCategory(' + x.id + ', this)">' + escapeHtml(x.name) + '</button>';
    });
    container.innerHTML = html;
}

function setCategory(cat, btn) {
    document.querySelectorAll('#categoryFilter .category-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active'); currentCategory = cat; renderPosts();
}
window.setCategory = setCategory;

function renderPostContent(post) {
    var html = '';
    if (post.content && post.content.includes('<')) {
        if (window.DOMPurify) html = DOMPurify.sanitize(post.content);
        else html = '<div style="white-space:pre-wrap;">' + escapeHtml(post.content) + '</div>';
    } else {
        html = '<div style="white-space:pre-wrap;">' + escapeHtml(post.content || '') + '</div>';
    }
    if (post.image_url && !html.includes('<img')) html += '<img src="' + escapeHtml(post.image_url) + '" style="max-width:100%;border-radius:8px;margin-top:6px;" />';
    return html;
}

function renderPosts() {
    var list = document.getElementById('postList');
    var filtered = posts.filter(function(p) { return currentCategory === '全部' || p.category_id === currentCategory; });
    if (!filtered.length) { 
        list.innerHTML = '<div class="empty-state">暂无帖子，快来抢沙发~</div>'; 
        return; 
    }
    
    var html = '';
    filtered.forEach(function(p) {
        var user = p.users || null;
        var name = user ? user.nickname : (p.author || '匿名');
        var avatar = user ? (user.avatar_url || getUserAvatar(user)) : getUserAvatar({ nickname: name });
        var time = new Date(p.created_at).toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        var commentCount = commentCountMap[p.id] || 0;
        
        var canDelete = isAdmin || (currentUser && String(currentUser.id) === String(p.user_id));
        var delBtn = canDelete ? '<button class="del-btn" data-id="' + p.id + '" style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:0.85em;padding:4px;">删除</button>' : '';
        var reportBtn = (currentUser && String(currentUser.id) !== String(p.user_id)) ? '<button class="report-btn" data-id="' + p.id + '" data-uid="' + p.user_id + '" data-snapshot="' + escapeHtml((p.content || '').substring(0,50)) + '" style="background:none;border:none;color:#F59E0B;cursor:pointer;font-size:0.85em;padding:4px;">举报</button>' : '';

        html += '<div class="post-card" data-id="' + p.id + '">';
        html += '<div class="post-author">';
        html += '<div class="avatar" style="' + (avatar.startsWith('http') ? 'background-image:url(' + avatar + ');background-size:cover;background-position:center;' : '') + '">' + (avatar.startsWith('http') ? '' : name.charAt(0).toUpperCase()) + '</div>';
        html += '<span class="name">' + escapeHtml(name) + '</span>';
        html += '<span class="time">' + time + '</span>';
        html += '</div>';
        if (p.title) html += '<div class="post-title">' + escapeHtml(p.title) + '</div>';
        html += '<div class="post-content">' + (window.DOMPurify ? DOMPurify.sanitize(p.content) : escapeHtml(p.content)) + '</div>';
        
        html += '<div class="post-footer" style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;border-top:1px solid var(--border);padding-top:12px;">';
        html += '<span class="comment-count" style="font-size:.75em;color:var(--text-light);">评论 ' + commentCount + '</span>';
        html += '<div class="actions" style="display:flex;gap:12px;">' + reportBtn + delBtn + '</div>';
        html += '</div>';
        html += '</div>';
    });
    list.innerHTML = html;
    
    list.querySelectorAll('.post-card').forEach(function(card) {
        card.onclick = function(e) {
            if(e.target.closest('button')) return;
            openPostDetail(this.dataset.id);
        }
    });

    list.querySelectorAll('.del-btn').forEach(function(btn) {
        btn.onclick = async function(e) {
            e.stopPropagation();
            if (await window.showCustomConfirm('删除帖子', '确定要删除这篇帖子吗？')) {
                await window.sb.from('posts').delete().eq('id', this.dataset.id);
                loadAll();
            }
        };
    });

    list.querySelectorAll('.report-btn').forEach(function(btn) {
        btn.onclick = async function(e) {
            e.stopPropagation();
            var reason = await window.showCustomPrompt('举报帖子', '请输入举报原因（如：色情低俗）');
            if (reason) {
                await window.sb.from('reports').insert([{ reporter_id: currentUser.id, reporter_name: currentUser.nickname, type: 'post', content_snapshot: this.dataset.snapshot, remark: reason, status: 'pending' }]);
                alert('举报已提交');
            }
        };
    });
}

async function loadAll() {
    setTimeout(function() { if (window.hidePageLoading) window.hidePageLoading(); }, 1500);
    try {
        document.getElementById('postList').innerHTML = `<div class="skeleton-card"><div class="skeleton skeleton-line" style="width:60%;"></div></div>`;
        
        var r1 = await window.sb.from('categories').select('*').order('sort_order');
        if (r1.error) throw new Error("分类加载失败: " + r1.error.message);
        categories = r1.data || [];
        
        var r2 = await window.sb.from('posts').select('*').order('created_at', { ascending: false });
        if (r2.error) throw new Error("帖子加载失败: " + r2.error.message);
        posts = r2.data || [];
        
        var map = await fetchProfilesMap(true);
        posts.forEach(function(p) { p.users = (p.user_id && map[p.user_id]) ? map[p.user_id] : null; });
        
        var cRes = await window.sb.from('post_comments').select('post_id');
        commentCountMap = {};
        if (!cRes.error) {
            (cRes.data || []).forEach(function(c) { commentCountMap[c.post_id] = (commentCountMap[c.post_id] || 0) + 1; });
        }
        
        renderCategoryFilter();
        renderPosts();
    } catch (e) { 
        console.error("loadAll error:", e);
        var el = document.getElementById('postList');
        if (el) el.innerHTML = '<div class="empty-state">加载失败：' + escapeHtml(e.message || String(e)) + '</div>'; 
    } finally {
        if (window.hidePageLoading) window.hidePageLoading();
    }
}

var currentDetailPost = null;
var replyToUserId = null;
var replyToName = null;
var replyToCommentId = null;

function openPostDetail(postId) {
    document.getElementById('detailOverlay').classList.add('active');
    var p = posts.find(function(x) { return x.id === postId; });
    if (!p) return;
    currentDetailPost = p;
    
    var user = p.users || null;
    var name = user ? user.nickname : (p.author || '匿名');
    var avatar = user ? (user.avatar_url || getUserAvatar(user)) : getUserAvatar({ nickname: name });
    var time = new Date(p.created_at).toLocaleString('zh-CN');
    
    var html = '<div class="detail-post"><div class="post-author">';
    html += '<div class="avatar" style="' + (avatar.startsWith('http') ? 'background-image:url(' + avatar + ');background-size:cover;background-position:center;' : '') + '">' + (avatar.startsWith('http') ? '' : name.charAt(0).toUpperCase()) + '</div>';
    html += '<span class="name">' + escapeHtml(name) + '</span>';
    html += '<span class="time">' + time + '</span>';
    html += '</div>';
    if (p.title) html += '<div class="post-title">' + escapeHtml(p.title) + '</div>';
    html += '<div class="post-content">' + renderPostContent(p) + '</div></div>';
    html += '<div class="detail-comments" id="commentList"><div class="loading-state"><div class="spinner"></div>加载评论...</div></div>';
    
    document.getElementById('detailContent').innerHTML = html;
    cancelReplyMode();
    loadComments(p.id);
}

async function loadComments(postId) {
    var cl = document.getElementById('commentList');
    try {
        var res = await window.sb.from('post_comments').select('*').eq('post_id', postId).order('created_at', { ascending: true });
        var comments = res.data || [];
        if (!comments.length) { cl.innerHTML = '<div class="empty-state">还没有评论，来说两句</div>'; return; }
        
        var map = await fetchProfilesMap(false);
        var h = '';
        var parents = comments.filter(c => !c.parent_id);
        var childrenMap = {};
        comments.filter(c => c.parent_id).forEach(c => {
            if (!childrenMap[c.parent_id]) childrenMap[c.parent_id] = [];
            childrenMap[c.parent_id].push(c);
        });

        function renderNode(c, isChild) {
            var cu = map[c.user_id] || null;
            var cn = cu ? cu.nickname : (c.author || '匿名');
            var cav = cu ? (cu.avatar_url || getUserAvatar(cu)) : getUserAvatar({nickname: cn});
            
            var html = '<div class="comment-item">';
            html += '<div class="avatar" style="' + (cav.startsWith('http') ? 'background-image:url(' + cav + ');background-size:cover;background-position:center;' : '') + '">' + (cav.startsWith('http') ? '' : cn.charAt(0).toUpperCase()) + '</div>';
            html += '<div class="body">';
            html += '<div class="meta">';
            html += '<span class="name">' + escapeHtml(cn) + '</span>';
            html += '<span class="time">' + new Date(c.created_at).toLocaleString('zh-CN', {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) + '</span>';
            
            html += '<div style="margin-left:auto;display:flex;gap:8px;">';
            if (currentUser.id === c.user_id || isAdmin) {
                html += '<button style="background:none;border:none;color:var(--danger);cursor:pointer;" onclick="deleteComment(\'' + c.id + '\')">删除</button>';
            }
            html += '<button style="background:none;border:none;color:var(--brand);cursor:pointer;" onclick="startReply(\'' + c.id + '\', \'' + c.user_id + '\', \'' + escapeHtml(cn) + '\')">回复</button>';
            html += '</div></div>';
            
            if (c.reply_to_user_id && isChild) {
                var replyName = map[c.reply_to_user_id] ? map[c.reply_to_user_id].nickname : '某用户';
                html += '<div style="font-size:0.85em;color:var(--brand);margin-bottom:4px;">回复 @' + escapeHtml(replyName) + '</div>';
            }
            html += '<div class="txt">' + escapeHtml(c.content) + '</div>';
            html += '</div></div>';
            return html;
        }

        parents.forEach(p => {
            h += renderNode(p, false);
            if (childrenMap[p.id] && childrenMap[p.id].length > 0) {
                h += '<div class="comment-children">';
                childrenMap[p.id].forEach(child => {
                    h += renderNode(child, true);
                });
                h += '</div>';
            }
        });
        
        cl.innerHTML = h;
    } catch (e) {
        cl.innerHTML = '<div class="empty-state">评论加载失败</div>';
    }
}

window.startReply = function(cid, uid, name) {
    replyToCommentId = cid;
    replyToUserId = uid;
    replyToName = name;
    var input = document.getElementById('detailCommentInput');
    input.placeholder = '回复 @' + name + '…';
    input.focus();
    document.getElementById('cancelReplyBtn').style.display = 'block';
};
function cancelReplyMode() {
    replyToUserId = null;
    replyToName = null;
    replyToCommentId = null;
    var input = document.getElementById('detailCommentInput');
    input.placeholder = '写评论…';
    input.value = '';
    document.getElementById('cancelReplyBtn').style.display = 'none';
}
document.getElementById('cancelReplyBtn').onclick = cancelReplyMode;

document.getElementById('detailSendCommentBtn').onclick = async function() {
    var input = document.getElementById('detailCommentInput');
    var text = input.value.trim();
    if (!text) return;
    this.disabled = true;
    try {
        var row = {
            post_id: currentDetailPost.id,
            user_id: currentUser.id,
            author: currentUser.nickname,
            content: text
        };
        if (replyToUserId) {
            row.reply_to_user_id = replyToUserId;
            row.parent_id = replyToCommentId;
        }
        var res = await window.sb.from('post_comments').insert([row]);
        if (res.error) throw res.error;
        
        // 更新评论数
        commentCountMap[currentDetailPost.id] = (commentCountMap[currentDetailPost.id] || 0) + 1;
        renderPosts();

        cancelReplyMode();
        await loadComments(currentDetailPost.id);
    } catch(e) {
        alert('评论失败：' + (e.message || '网络错误'));
    } finally {
        this.disabled = false;
    }
};

window.deleteComment = async function(id) {
    if (!(await window.showCustomConfirm('删除评论', '确定删除这条评论吗？'))) return;
    try {
        await window.sb.from('post_comments').delete().eq('id', id);
        loadComments(currentDetailPost.id);
        // 更新评论数
        if (commentCountMap[currentDetailPost.id] > 0) {
            commentCountMap[currentDetailPost.id]--;
            renderPosts();
        }
    } catch(e) { alert('删除失败'); }
};

document.getElementById('closeDetail').onclick = function() {
    document.getElementById('detailOverlay').classList.remove('active');
};

function openAdminPanel() { window.location.href = './admin.html'; }
window.openAdminPanel = openAdminPanel;

// 启动
loadAll();
</script>
