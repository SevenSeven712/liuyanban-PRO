<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#10B981" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>后台管理 · Seven戚</title>
<link rel="stylesheet" href="./theme.css" />
<script src="./vendor/supabase.js"></script>
<script>window.supabase||document.write('<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>');</script>
<script src="common.js"></script>
<style>
.app-header .back{background:none;border:none;cursor:pointer;color:var(--text);display:flex;padding:4px;border-radius:8px;transition:var(--transition-smooth);}
.app-header .back:hover{background:var(--border);}
.app-header .back svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.app-header .title{font-weight:700;font-size:1.05em;flex:1;}

.admin-body{flex:1;overflow-y:auto;padding:20px 16px calc(24px + env(safe-area-inset-bottom));}

.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px;}
.stat-card{background:var(--bg-surface);border-radius:var(--radius-md);padding:16px;border:1px solid var(--border);box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:8px;}
.stat-card .label{font-size:0.85em;color:var(--text-muted);font-weight:600;}
.stat-card .value{font-size:2em;font-weight:700;color:var(--brand);}

.admin-tabs{display:flex;gap:8px;margin-bottom:20px;background:var(--bg);padding:4px;border-radius:var(--radius-pill);border:1px solid var(--border);}
.admin-tab{flex:1;padding:10px;border:none;background:transparent;border-radius:var(--radius-pill);font-family:inherit;font-size:.9em;font-weight:600;color:var(--text-muted);cursor:pointer;transition:var(--transition-smooth);}
.admin-tab.active{background:var(--bg-surface);color:var(--brand);box-shadow:var(--shadow-sm);}

.list-container{background:var(--bg-surface);border-radius:var(--radius-md);border:1px solid var(--border);box-shadow:var(--shadow-sm);overflow:hidden;}
.list-item{display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--border-subtle);}
.list-item:last-child{border-bottom:none;}
.list-item .avatar{width:40px;height:40px;border-radius:50%;background:var(--brand-bg);color:var(--brand-dark);display:grid;place-items:center;font-weight:600;font-size:16px;background-size:cover;background-position:center;}
.list-item .info{flex:1;min-width:0;}
.list-item .name{font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px;}
.list-item .meta{font-size:0.75em;color:var(--text-muted);margin-top:4px;}
.list-item .actions{display:flex;gap:8px;flex-wrap:wrap;}
.btn-sm{padding:6px 12px;border-radius:var(--radius-sm);border:none;font-size:0.8em;font-weight:600;cursor:pointer;transition:var(--transition-smooth);font-family:inherit;white-space:nowrap;}
.btn-ban{background:var(--danger-bg);color:var(--danger);}
.btn-unban{background:var(--brand-bg);color:var(--brand-dark);}
.btn-coin-add{background:#EFF6FF;color:#2563EB;}
.btn-coin-sub{background:#FEF2F2;color:#DC2626;}
.banned-tag{background:var(--danger-bg);color:var(--danger);font-size:0.65em;padding:2px 6px;border-radius:4px;}

.skeleton-item{display:flex;gap:12px;padding:16px;border-bottom:1px solid var(--border-subtle);}
.skeleton-avatar{width:40px;height:40px;border-radius:50%;}
.skeleton-line{height:16px;background:var(--border);border-radius:4px;margin-bottom:6px;animation:shimmer 1.5s infinite linear;background-image: linear-gradient(90deg, #E5E7EB 0px, #F3F4F6 40px, #E5E7EB 80px);background-size:200% 100%;}
@keyframes shimmer{0%{background-position:-200% 0;}100%{background-position:200% 0;}}

/* 403 页面样式 */
.forbidden-wrap{position:fixed;inset:0;background:#f8fafc;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;font-family:var(--font-family);}
.forbidden-code{font-size:6em;font-weight:900;color:#ef4444;line-height:1;}
.forbidden-desc{font-size:1.2em;color:#64748b;margin:16px 0 24px;font-weight:500;}
.forbidden-btn{padding:10px 24px;border-radius:8px;background:#10b981;color:#fff;text-decoration:none;font-weight:600;transition:all .2s;}
.forbidden-btn:hover{background:#059669;}
</style>
</head>
<body>

<!-- 拦截遮罩（默认隐藏） -->
<div id="forbiddenScreen" class="forbidden-wrap" style="display:none;">
  <div class="forbidden-code">403</div>
  <div class="forbidden-desc">Access Denied. 您没有权限访问此页面。</div>
  <a href="./posts.html" class="forbidden-btn">返回首页</a>
</div>

<div id="mainApp" style="display:none;"> <!-- 默认隐藏，验证通过后再显示 -->
  <div class="app-header">
    <button class="back" onclick="history.back()"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
    <span class="title">后台管理</span>
    <div style="width:32px;"></div>
  </div>
  
  <div class="admin-body">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="label">总注册用户</div>
        <div class="value" id="totalUsers">--</div>
      </div>
      <div class="stat-card">
        <div class="label">当前封禁数</div>
        <div class="value" style="color:var(--danger);" id="bannedUsers">--</div>
      </div>
    </div>

    <div class="admin-tabs">
      <button class="admin-tab active" data-tab="users" onclick="switchTab('users')">用户管理</button>
      <button class="admin-tab" data-tab="reports" onclick="switchTab('reports')">举报处理</button>
      <button class="admin-tab" data-tab="categories" onclick="switchTab('categories')">分类管理</button>
    </div>

    <div id="listContainer" class="list-container"></div>
  </div>
</div>

<script>
var currentUser = getSessionUser();
if (!currentUser) window.location.href = './index.html';

var currentTab = 'users';
var isAdminValid = false;

function $(id) { return document.getElementById(id); }
function escapeHtml(s) { if (!s) return ''; return String(s).replace(/[&<>"']/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
async function showToast(msg) { await window.showCustomAlert('提示', msg); }

// 🚨 核心 403 拦截验证引擎 🚨
async function checkAdminPermission() {
  if (!currentUser || !currentUser.id) return false;
  try {
    // 向服务端确认身份
    var r = await window.sb.rpc('get_my_profile');
    if (r.data && r.data.is_admin === true) {
       currentUser.is_admin = true;
       setSessionUser(currentUser);
       return true;
    }
  } catch(e) {}
  return false;
}

// 页面初始化
(async function initAuth() {
  if(window.showLoading) window.showLoading();
  var pass = await checkAdminPermission();
  if(window.hideLoading) window.hideLoading();

  if (!pass) {
    // 验证失败，显示 403 页，隐藏主体
    document.getElementById('mainApp').style.display = 'none';
    document.getElementById('forbiddenScreen').style.display = 'flex';
    return;
  }

  // 验证通过，展示页面
  document.getElementById('mainApp').style.display = 'flex';
  document.getElementById('forbiddenScreen').style.display = 'none';
  isAdminValid = true;

  // 加载数据
  loadUsers();
})();

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.admin-tab').forEach(function(b) { b.classList.toggle('active', b.dataset.tab === tab); });
  if (tab === 'users') loadUsers();
  else if (tab === 'reports') loadReports();
  else if (tab === 'categories') loadCategories();
}
window.switchTab = switchTab;

async function loadUsers() {
  if (!isAdminValid) return;
  if(window.showLoading) window.showLoading();
  var container = $('listContainer');
  container.innerHTML = '<div class="skeleton-item"><div class="skeleton skeleton-avatar"></div><div style="flex:1"><div class="skeleton skeleton-line" style="width:40%"></div><div class="skeleton skeleton-line" style="width:60%"></div></div></div>'.repeat(3);

  try {
    var r = await window.sb.rpc('admin_list_users');
    if (r.error) throw r.error;
    var users = r.data || [];
    
    var total = users.length;
    var bannedCount = 0;
    
    var html = '';
    users.forEach(function(u) {
      var isBanned = u.banned_until && new Date(u.banned_until) > new Date();
      if (isBanned) bannedCount++;
      
      var avStyle = (u.avatar_url && u.avatar_url.indexOf('http') === 0) ? 'background-image:url('+u.avatar_url+');' : '';
      var initial = avStyle ? '' : escapeHtml(String(u.nickname||'U').charAt(0).toUpperCase());
      
      html += '<div class="list-item">';
      html += '<div class="avatar" style="'+avStyle+'">'+initial+'</div>';
      html += '<div class="info">';
      html += '<div class="name">' + escapeHtml(u.nickname || '未命名') + ' ' + (isBanned ? '<span class="banned-tag">已封禁</span>' : '') + '</div>';
      html += '<div class="meta">余额: <span style="color:var(--warning);font-weight:700;">'+ (u.coins || 0) +'</span> 币 | IP: ' + escapeHtml(u.ip_address || '未知') + ' | 注册于 ' + new Date(u.created_at).toLocaleDateString() + '</div>';
      html += '</div>';
      
      html += '<div class="actions">';
      // 加减币按钮
      html += '<button class="btn-sm btn-coin-add" onclick="changeCoins(''+u.id+'', 'add')">加币</button>';
      html += '<button class="btn-sm btn-coin-sub" onclick="changeCoins(''+u.id+'', 'sub')">减币</button>';
      
      // 封禁按钮
      if (isBanned) {
        html += '<button class="btn-sm btn-unban" onclick="unbanUser('' + u.id + '')">解封</button>';
      } else {
        if (u.id !== currentUser.id) {
          html += '<button class="btn-sm btn-ban" onclick="banUser('' + u.id + '')">封禁</button>';
        }
      }
      html += '</div></div>';
    });
    
    container.innerHTML = html || '<div style="padding:20px;text-align:center;color:var(--text-muted);">暂无用户</div>';
    $('totalUsers').textContent = total;
    $('bannedUsers').textContent = bannedCount;
    
  } catch(e) {
    container.innerHTML = '<div style="padding:20px;text-align:center;color:var(--danger);">加载失败：请确保数据库有 admin_list_users 函数</div>';
  } finally {
    if(window.hideLoading) window.hideLoading();
  }
}

// 🚨 加币 / 减币逻辑 🚨
window.changeCoins = async function(uid, type) {
  if (!isAdminValid) return;
  var promptMsg = type === 'add' ? '请输入要增加的金额（小七币）' : '请输入要扣除的金额（小七币）';
  var amountStr = await window.showCustomPrompt('修改用户余额', promptMsg);
  if (amountStr === null || amountStr.trim() === '') return;
  
  var amount = parseInt(amountStr, 10);
  if (isNaN(amount) || amount <= 0) {
    return showToast('请输入大于 0 的有效数字');
  }

  try {
    // 1. 获取该用户当前余额
    var r = await window.sb.from('users').select('coins').eq('id', uid).single();
    if (r.error) throw r.error;
    var currentCoins = r.data.coins || 0;
    
    // 2. 计算新余额
    var newCoins = type === 'add' ? (currentCoins + amount) : Math.max(0, currentCoins - amount);
    
    // 3. 更新余额
    var up = await window.sb.from('users').update({ coins: newCoins }).eq('id', uid);
    if (up.error) throw up.error;
    
    showToast('修改成功！当前用户余额：' + newCoins + ' 币');
    loadUsers(); // 刷新列表
  } catch(e) {
    showToast('修改失败：' + e.message + ' (请确保数据库 users 表允许管理员更新)');
  }
};

async function banUser(id) {
  if (!isAdminValid) return;
  if (!(await window.showCustomConfirm('封禁用户', '确定要封禁该用户吗？'))) return;
  try {
    var r = await window.sb.rpc('admin_ban_user', { p_user_id: id, p_days: 36500, p_reason: '违反社区规定' });
    if (r.error) throw r.error;
    showToast('已封禁');
    loadUsers();
  } catch(e) { showToast('操作失败: ' + e.message); }
}
window.banUser = banUser;

async function unbanUser(id) {
  if (!isAdminValid) return;
  if (!(await window.showCustomConfirm('解封用户', '确定要解封该用户吗？'))) return;
  try {
    var r = await window.sb.rpc('admin_unban_user', { p_user_id: id });
    if (r.error) throw r.error;
    showToast('已解封');
    loadUsers();
  } catch(e) { showToast('操作失败: ' + e.message); }
}
window.unbanUser = unbanUser;

async function loadReports() {
  if (!isAdminValid) return;
  var container = $('listContainer');
  container.innerHTML = '<div class="skeleton-item"><div class="skeleton skeleton-avatar"></div><div style="flex:1"><div class="skeleton skeleton-line" style="width:40%"></div><div class="skeleton skeleton-line" style="width:60%"></div></div></div>'.repeat(3);
  $('totalUsers').textContent = '-';
  $('bannedUsers').textContent = '-';

  try {
    var r = await window.sb.from('reports').select('*').order('created_at', { ascending: false });
    if (r.error) {
      // 如果 reports 表查询失败，尝试旧的 messages 表逻辑作为备用
      var r2 = await window.sb.from('messages').select('*').like('text', '【系统举报】%').order('created_at', { ascending: false });
      if(r2.error) throw r2.error;
      var reports = r2.data || [];
      if (!reports.length) { container.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-muted);">暂无举报记录</div>'; return; }
      
      container.innerHTML = reports.map(function(rep) {
        var time = new Date(rep.created_at).toLocaleString('zh-CN');
        return '<div class="list-item" style="flex-direction:column;align-items:flex-start;gap:10px;">' +
          '<div style="display:flex;width:100%;justify-content:space-between;"><b style="color:var(--danger);">举报信息</b><span style="font-size:0.75em;">'+time+'</span></div>' +
          '<div style="font-size:.85em;width:100%;background:var(--bg);padding:12px;border-radius:8px;">'+escapeHtml(rep.text).replace(/
/g, '<br>')+'</div>' +
          '<div style="display:flex;width:100%;justify-content:flex-end;"><button class="btn-sm btn-ban" onclick="deleteReport(''+rep.id+'')">已处理 / 删除</button></div>' +
        '</div>';
      }).join('');
      return;
    }
    
    var list = r.data || [];
    if (!list.length) { container.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-muted);">暂无举报记录</div>'; return; }
    container.innerHTML = list.map(function(rep) {
      var time = new Date(rep.created_at).toLocaleString('zh-CN');
      return '<div class="list-item" style="flex-direction:column;align-items:flex-start;gap:10px;">' +
        '<div style="display:flex;width:100%;justify-content:space-between;"><b style="color:var(--danger);">举报人：'+escapeHtml(rep.reporter_name||'')+'</b><span style="font-size:0.75em;">'+time+'</span></div>' +
        '<div style="font-size:.85em;width:100%;background:var(--bg);padding:12px;border-radius:8px;">类型：' + escapeHtml(rep.type) + '<br>内容：' + escapeHtml(rep.content_snapshot) + '<br>备注：' + escapeHtml(rep.remark || '无') + '</div>' +
        '<div style="display:flex;width:100%;justify-content:flex-end;"><button class="btn-sm btn-ban" onclick="deleteReport(''+rep.id+'')">已处理 / 删除</button></div>' +
      '</div>';
    }).join('');
  } catch(e) {
    container.innerHTML = '<div style="padding:20px;text-align:center;color:var(--danger);">加载失败：' + e.message + '</div>';
  }
}

window.deleteReport = async function(id) {
  if (!isAdminValid) return;
  if (!(await window.showCustomConfirm('删除举报', '确认已处理该举报并删除记录？'))) return;
  try {
    await window.sb.from('reports').delete().eq('id', id);
    await window.sb.from('messages').delete().eq('id', id); // 兼容老逻辑
    loadReports();
  } catch(e) { showToast('删除失败: ' + e.message); }
};

async function loadCategories() {
  if (!isAdminValid) return;
  var container = $('listContainer');
  container.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);">加载中...</div>';
  $('totalUsers').textContent = '-';
  $('bannedUsers').textContent = '-';

  try {
    var r = await window.sb.from('categories').select('*').order('sort_order');
    if (r.error) throw r.error;
    var cats = r.data || [];
    
    var html = '<div style="padding:16px;">' +
      '<div style="display:flex;gap:8px;margin-bottom:16px;">' +
      '<input type="text" id="newCatName" placeholder="输入新分类名称" style="flex:1;padding:10px;border-radius:8px;border:1px solid #ccc;outline:none;">' +
      '<button onclick="addCategory()" style="background:var(--brand);color:#fff;border:none;padding:10px 16px;border-radius:8px;font-weight:600;cursor:pointer;">添加</button>' +
      '</div>';
      
    if (!cats.length) {
      html += '<div style="text-align:center;padding:20px;color:var(--text-muted);">暂无分类</div>';
    } else {
      html += '<div class="list-container" style="border-radius:8px;border:1px solid var(--border);overflow:hidden;">';
      cats.forEach(function(c) {
        html += '<div class="list-item" style="border-bottom:1px solid var(--border-subtle);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;">' +
          '<div class="info"><div class="name" style="font-weight:600;">' + escapeHtml(c.name) + '</div><div class="meta" style="font-size:0.75em;color:var(--text-muted);">排序: ' + c.sort_order + '</div></div>' +
          '<button class="btn-sm btn-ban" onclick="deleteCategory(' + c.id + ')">删除</button>' +
          '</div>';
      });
      html += '</div>';
    }
    html += '</div>';
    container.innerHTML = html;
  } catch(e) {
    container.innerHTML = '<div style="padding:20px;text-align:center;color:var(--danger);">加载失败：' + e.message + '</div>';
  }
}

window.addCategory = async function() {
  if (!isAdminValid) return;
  var name = document.getElementById('newCatName').value.trim();
  if(!name) return showToast('请输入分类名称');
  try {
    await window.sb.from('categories').insert([{ name: name, sort_order: 99, is_public: true }]);
    loadCategories();
  } catch(e) { showToast('添加失败：' + e.message); }
};

window.deleteCategory = async function(id) {
  if (!isAdminValid) return;
  if (!(await window.showCustomConfirm('删除分类', '确定删除该分类吗？该分类下的帖子将变为未分类。'))) return;
  try {
    await window.sb.from('categories').delete().eq('id', id);
    loadCategories();
  } catch(e) { showToast('删除失败：' + e.message); }
};

// 兜底：如果因为网络卡住，2秒后强制关闭遮罩
setTimeout(() => { if(window.hideLoading) window.hideLoading(); }, 2000);
</script>
</body>
</html>
