<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#2e7d32" />
<link rel="apple-touch-icon" href="./icon.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Seven戚 · 用户主页</title>
<script src="./vendor/supabase.js"></script>
<script>window.supabase||document.write('<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"><\/script>');</script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root{
  --bg:#f5faf5; --bg-card:#fff; --bg-input:#eaf3ea; --border:#c8e0c8;
  --text:#1e3a2e; --text-muted:#5a7a6a; --text-light:#8aaa9a;
  --primary:#2e7d32; --primary-light:#4caf50; --primary-bg:#e8f5e9;
  --shadow:0 8px 32px rgba(46,125,50,.12); --radius:16px; --radius-sm:10px;
  --font:"Space Grotesk","PingFang SC","Segoe UI",system-ui,sans-serif;
  --danger:#e57373; --danger-bg:#ffebee;
}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden}
#mainApp{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* ====== 顶部 Header ====== */
.app-header{flex-shrink:0;padding:12px 20px;background:rgba(255,255,255,.92);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;z-index:50;min-height:56px}
.brand{font-weight:800;font-size:1.15em;color:var(--text);display:flex;align-items:center;gap:.2em}
.brand span{color:var(--primary)}
.header-right{display:flex;align-items:center;gap:8px}
.user-area{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:99px;cursor:pointer;}
.user-area .avatar{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;background-size:cover;background-position:center;flex-shrink:0}
.user-area .user-name{font-size:.85em;font-weight:600}
.user-area .chevron{font-size:.7em;color:var(--text-light)}

/* ====== 页面内容 ====== */
.page-content{flex:1;overflow-y:auto;padding:16px 16px 80px; -webkit-overflow-scrolling: touch;}

/* ====== 资料卡 ====== */
.profile-hero{background:linear-gradient(135deg,#2e7d32,#4caf50);border-radius:var(--radius);padding:24px 20px 20px;color:#fff;position:relative;overflow:hidden}
.profile-hero::after{content:'';position:absolute;right:-30px;top:-30px;width:120px;height:120px;background:rgba(255,255,255,.1);border-radius:50%}
.hero-main{display:flex;align-items:center;gap:16px;position:relative;z-index:1}
.hero-avatar{width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.25);color:#fff;display:grid;place-items:center;font-size:32px;font-weight:800;background-size:cover;background-position:center;flex-shrink:0;border:3px solid rgba(255,255,255,.5)}
.hero-info{flex:1;min-width:0}
.hero-name{font-size:1.35em;font-weight:800;margin-bottom:8px}
.hero-stats{display:flex;gap:22px;align-items:baseline}
.hero-stat{display:flex;align-items:baseline;gap:4px}
.hero-stat .num{font-size:1.1em;font-weight:800}
.hero-stat .lbl{font-size:.72em;opacity:.85}
.hero-line2{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:.72em;opacity:.85}
.hero-no{opacity:.9}
.hero-bio{font-size:.84em;opacity:.92;margin-top:14px;line-height:1.6;position:relative;z-index:1;word-break:break-word;padding-top:12px;border-top:1px solid rgba(255,255,255,.2)}
.hero-actions{display:flex;gap:10px;margin-top:16px;position:relative;z-index:1}
.btn-follow{flex:1;padding:11px;border:2px solid #fff;border-radius:10px;font-weight:800;font-family:inherit;font-size:.9em;cursor:pointer;background:#fff;color:var(--primary)}
.btn-follow.following{background:transparent;color:#fff}
.btn-edit-profile{flex:1;padding:11px;border:2px solid #fff;border-radius:10px;font-weight:800;font-family:inherit;font-size:.9em;cursor:pointer;background:#fff;color:var(--primary)}

/* ====== 宫格导航 ====== */
.nav-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px;margin:18px 0 4px}
.nav-cell{background:none;border:none;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:transform .18s;text-align:center}
.nav-cell:active{transform:scale(.92)}
.nav-cell .ic{width:52px;height:52px;border-radius:50%;background:var(--primary-bg);display:grid;place-items:center;color:var(--primary);transition:all .18s;box-shadow:0 2px 8px rgba(46,125,50,.10)}
.nav-cell:hover .ic{background:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(46,125,50,.28);transform:translateY(-2px)}
/* 严格限制图标宽高，防止撑爆 */
.nav-cell .ic svg{width:24px !important;height:24px !important;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-cell .tx{font-size:.72em;font-weight:600;color:var(--text-muted)}

/* ====== 帖子列表 ====== */
.tabs{display:flex;gap:8px;margin:16px 0 12px;border-bottom:1px solid var(--border)}
.tab{padding:10px 4px;border:none;background:none;font-family:inherit;font-size:.88em;font-weight:700;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;margin-right:8px}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.post-card{background:var(--bg-card);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:10px;border:1px solid var(--border);box-shadow:0 2px 8px rgba(46,125,50,.05);cursor:pointer}
.post-card .post-title{font-weight:700;font-size:.95em;margin-bottom:6px}
.post-card .post-body{font-size:.82em;color:var(--text-muted);line-height:1.5;max-height:60px;overflow:hidden}
.post-card .post-foot{font-size:.7em;color:var(--text-light);margin-top:8px;display:flex;gap:12px}
.empty{text-align:center;padding:40px 20px;color:var(--text-muted);font-size:.85em}
.loading-state{text-align:center;padding:40px 20px}
.spinner{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ====== 底部导航 (直接硬编码) ====== */
.app-tabs{flex-shrink:0;display:flex;background:rgba(255,255,255,.96);border-top:1px solid var(--border);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:50}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;font-family:var(--font);font-size:.6em;font-weight:600;color:var(--text-muted);padding:4px 0;cursor:pointer;text-decoration:none;position:relative}
.tab-btn .tab-icon{font-size:1.6em;line-height:1.2;display:flex;align-items:center;justify-content:center;width:1.7em;height:1.7em}
.tab-btn .tab-icon svg{width:100% !important;height:100% !important;display:block;stroke:currentColor;fill:none}
.tab-btn.active{color:var(--primary)}
.tab-btn.active::after{content:'';position:absolute;top:-1px;left:30%;right:30%;height:3px;background:var(--primary);border-radius:0 0 4px 4px}

/* ====== 弹窗 & Toast ====== */
.edit-modal{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px}
.edit-modal.active{display:flex}
.edit-box{background:#fff;border-radius:var(--radius);padding:22px 20px;max-width:400px;width:100%;max-height:86vh;overflow-y:auto}
.edit-box h3{font-size:1.05em;margin-bottom:16px}
.edit-field{margin-bottom:14px}
.edit-field label{display:block;font-size:.78em;font-weight:700;color:var(--text-muted);margin-bottom:6px}
.edit-field input,.edit-field select,.edit-field textarea{width:100%;padding:10px 12px;border:2px solid var(--border);border-radius:10px;font-family:inherit;font-size:.88em;outline:none;background:var(--bg-input);color:var(--text);box-sizing:border-box}
.edit-field textarea{min-height:70px;resize:vertical}
.edit-field input:focus,.edit-field textarea:focus,.edit-field select:focus{border-color:var(--primary)}
.edit-actions{display:flex;gap:10px;margin-top:8px}
.edit-actions button{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;font-family:inherit;font-size:.88em;cursor:pointer}
.edit-actions .cancel{background:var(--bg-input);color:var(--text-muted)}
.edit-actions .ok{background:var(--primary);color:#fff}
.logout-btn{width:100%;margin-top:10px;padding:11px;border:1px solid var(--danger);border-radius:10px;background:var(--danger-bg);color:var(--danger);font-weight:700;font-family:inherit;font-size:.88em;cursor:pointer}
.avatar-edit{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.avatar-edit .av{width:64px;height:64px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:800;background-size:cover;background-position:center;flex-shrink:0}
.avatar-edit label{font-size:.8em;color:var(--primary);font-weight:700;cursor:pointer;text-decoration:underline}
.custom-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:2000;padding:20px}
.custom-modal.active{display:flex}
.modal-box{background:var(--bg-card);padding:24px;border-radius:var(--radius);max-width:400px;width:100%;box-shadow:var(--shadow)}
.modal-title{font-size:1.2em;font-weight:700;margin-bottom:8px;color:var(--text)}
.modal-body{font-size:.95em;color:var(--text-muted);line-height:1.6;margin-bottom:16px;white-space:pre-wrap}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}
.modal-actions button{padding:9px 20px;border:none;border-radius:8px;font-weight:700;font-family:inherit;font-size:.85em;cursor:pointer}
.modal-actions .btn-danger{background:var(--danger);color:#fff}
.modal-actions .btn-secondary{background:var(--bg-input);color:var(--text-muted)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:rgba(0,0,0,.82);color:#fff;padding:10px 20px;border-radius:10px;font-size:.85em;opacity:0;pointer-events:none;transition:all .3s;z-index:9999;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="mainApp">
  <div id="header-container"></div>
  
  <div class="page-content" id="pageContent">
    <div class="loading-state"><div class="spinner"></div>加载中...</div>
  </div>

  <!-- 底部导航直接写死 -->
  <div id="footer-container">
    <div class="app-tabs">
      <a href="./posts.html" class="tab-btn" id="tab-posts">
        <span class="tab-icon"><svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 18V42H39V18L24 6L9 18Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 29V42H29V29H19Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><path d="M9 42H39" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg></span>
        帖子
      </a>
      <a href="./messages.html" class="tab-btn" id="tab-messages">
        <span class="tab-icon"><svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M40 33V42C40 43.1046 39.1046 44 38 44H31.5" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 16V6C40 4.89543 39.1046 4 38 4H10C8.89543 4 8 4.89543 8 6V42C8 43.1046 8.89543 44 10 44H16" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 16H30" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="M23 44L40 23" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="M16 24H24" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg></span>
        留言板
      </a>
      <a href="./chats.html" class="tab-btn" id="tab-chats">
        <span class="tab-icon"><svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 6H44V36H29L24 41L19 36H4V6Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M23 21H25.0025" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="M33.001 21H34.9999" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="M13.001 21H14.9999" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg></span>
        消息
      </a>
      <a href="./user.html" class="tab-btn active" id="tab-profile">
        <span class="tab-icon"><svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="24" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M42 44C42 34.0589 33.9411 26 24 26C14.0589 26 6 34.0589 6 44" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        个人
      </a>
    </div>
  </div>
</div>

<!-- 编辑资料弹窗 -->
<div class="edit-modal" id="editModal">
  <div class="edit-box">
    <h3>编辑资料</h3>
    <div class="avatar-edit">
      <div class="av" id="editAvatar">U</div>
      <div>
        <label for="editAvatarInput">更换头像</label>
        <input type="file" id="editAvatarInput" accept="image/*" style="display:none" />
      </div>
    </div>
    <div class="edit-field"><label>昵称</label><input type="text" id="editNickname" maxlength="12" /></div>
    <div class="edit-field"><label>简介</label><textarea id="editBio" maxlength="100" placeholder="介绍一下自己…"></textarea></div>
    <div class="edit-field"><label>性别</label><select id="editGender"><option value="">保密</option><option value="男">男</option><option value="女">女</option></select></div>
    <div class="edit-field"><label>生日</label><input type="date" id="editBirthday" /></div>
    <div class="edit-actions">
      <button class="cancel" onclick="closeEdit()">取消</button>
      <button class="ok" onclick="saveProfile()">保存</button>
    </div>
    <button class="logout-btn" onclick="doLogout()">退出登录</button>
  </div>
</div>

<div class="custom-modal" id="confirmModal">
  <div class="modal-box">
    <div class="modal-title" id="confirmTitle"></div>
    <div class="modal-body" id="confirmBody"></div>
    <div class="modal-actions">
      <button class="btn-secondary" id="confirmCancel">取消</button>
      <button class="btn-danger" id="confirmOk">确定</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script src="./common.js"></script>
<script>
var currentUser = getSessionUser();
if (!currentUser || !currentUser.id) window.location.href = './index.html';

var viewingUser = null;
var isSelf = false;
var iFollowed = false;
var myPosts = [];

function $(id){ return document.getElementById(id); }
function escapeHtml(s){ if(!s) return ''; return String(s).replace(/[&<>"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function showToast(msg){ var t=$('toast'); if(!t) return; t.textContent=msg; t.classList.add('show'); clearTimeout(window.__tt); window.__tt=setTimeout(function(){t.classList.remove('show');},2200); }

function getTargetParam(){
  var p = new URLSearchParams(location.search);
  return { id: p.get('id') };
}

async function loadUser(){
  var t = getTargetParam();
  var isViewingSelf = (!t.id) || (t.id === currentUser.id);
  var q;
  if (isViewingSelf) {
    q = window.sb.rpc('get_my_profile');
  } else {
    q = window.sb.from('public_profiles').select('*').eq('id', t.id).single();
  }
  var res = await q;
  if (res.error) { $('pageContent').innerHTML = '<div class="empty">用户不存在或加载失败</div>'; return false; }
  var row = Array.isArray(res.data) ? res.data[0] : res.data;
  if (!row) { $('pageContent').innerHTML = '<div class="empty">用户不存在</div>'; return false; }
  viewingUser = row;
  isSelf = (viewingUser.id === currentUser.id);
  return true;
}

function avatarOf(u){
  if (u.avatar_url && String(u.avatar_url).indexOf('http') === 0)
    return '<div class="hero-avatar" style="background-image:url(' + escapeHtml(u.avatar_url) + ');background-size:cover;background-position:center;"></div>';
  return '<div class="hero-avatar">' + escapeHtml(String(u.nickname||'U').charAt(0).toUpperCase()) + '</div>';
}

async function loadFollow(){
  if (isSelf) return;
  var r = await window.sb.from('follows').select('id').eq('follower_id', currentUser.id).eq('following_id', viewingUser.id);
  iFollowed = !!(r.data && r.data.length);
}

async function loadCounts(){
  var f1 = await window.sb.from('follows').select('id', { count:'exact', head:true }).eq('following_id', viewingUser.id);
  var f2 = await window.sb.from('follows').select('id', { count:'exact', head:true }).eq('follower_id', viewingUser.id);
  return { fans: f1.count || 0, following: f2.count || 0 };
}

async function loadPosts(){
  var r = await window.sb.from('posts').select('*').eq('user_id', viewingUser.id).order('created_at', { ascending:false });
  myPosts = r.data || [];
}

async function render(){
  if (!(await loadUser())) return;
  await loadFollow();
  await loadPosts();
  var counts = await loadCounts();

  var hero = '<div class="profile-hero">';
  hero += '<div class="hero-main">';
  hero += avatarOf(viewingUser);
  hero += '<div class="hero-info">';
  hero += '<div class="hero-name">' + escapeHtml(viewingUser.nickname || '用户') + '</div>';
  hero += '<div class="hero-stats">' +
    '<div class="hero-stat"><span class="num">' + myPosts.length + '</span><span class="lbl">帖子</span></div>' +
    '<div class="hero-stat"><span class="num">' + counts.fans + '</span><span class="lbl">粉丝</span></div>' +
    '<div class="hero-stat"><span class="num">' + counts.following + '</span><span class="lbl">关注</span></div>' +
    '</div>';
  var line2 = '<span class="hero-no">ID: ' + escapeHtml(viewingUser.custom_uid || viewingUser.id.slice(0,8)) + '</span>';
  if (viewingUser.gender === '男') {
    line2 += '<span class="hero-gender male" title="男"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="14" r="5"/><line x1="19" y1="5" x2="13.5" y2="10.5"/><polyline points="15 5 19 5 19 9"/></svg></span>';
  } else if (viewingUser.gender === '女') {
    line2 += '<span class="hero-gender female" title="女"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="5"/><line x1="12" y1="14" x2="12" y2="22"/><line x1="9" y1="19" x2="15" y2="19"/></svg></span>';
  }
  hero += '<div class="hero-line2">' + line2 + '</div>';
  hero += '</div></div>';
  hero += '<div class="hero-bio">' + (viewingUser.bio ? escapeHtml(viewingUser.bio) : '这个人很懒，没有写简介') + '</div>';
  hero += '<div class="hero-actions">';
  if (isSelf) {
    hero += '<button class="btn-edit-profile" onclick="openEdit()">编辑资料</button>';
  } else {
    hero += '<button class="btn-follow' + (iFollowed?' following':'') + '" onclick="toggleFollow()">' + (iFollowed?'已关注':'+ 关注') + '</button>';
  }
  hero += '</div></div>';

  var navHtml = '';
  if (isSelf) {
    var isAdmin = (currentUser && currentUser.is_admin === true);
    navHtml = '<div class="nav-grid">' +
      '<div class="nav-cell" onclick="location.href=\'./profile.html?view=messages\'"><div class="ic"><svg viewBox="0 0 24 24"><path d="M4 4h16v12H5.17L4 17.17V4z"/></svg></div><div class="tx">消息中心</div></div>' +
      '<div class="nav-cell" onclick="location.href=\'./profile.html?view=feedback\'"><div class="ic"><svg viewBox="0 0 24 24"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div><div class="tx">反馈 Bug</div></div>' +
      '<div class="nav-cell" onclick="location.href=\'./profile.html?view=about\'"><div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></div><div class="tx">关于我们</div></div>' +
      (isAdmin ? '<div class="nav-cell" onclick="location.href=\'./profile.html?view=adminfeedback\'"><div class="ic"><svg viewBox="0 0 24 24"><path d="M3 3h18v14H5l-2 2V3z"/><path d="M8 8h8M8 12h5"/></svg></div><div class="tx">反馈管理</div></div>' : '') +
      (isAdmin ? '<div class="nav-cell" onclick="location.href=\'./profile.html?view=sites\'"><div class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></div><div class="tx">网站管理</div></div>' : '') +
      '<div class="nav-cell" onclick="location.href=\'./shop.html\'"><div class="ic"><svg viewBox="0 0 24 24"><path d="M3 9l1.5-5h15L21 9"/><path d="M4 9v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9"/><path d="M3 9h18"/><path d="M9 13a3 3 0 0 0 6 0"/></svg></div><div class="tx">皮肤商店</div></div>' +
      '<div class="nav-cell" onclick="location.href=\'./assets.html\'"><div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h5M9.5 14.5h5"/></svg></div><div class="tx">我的资产</div></div>' +
      '<div class="nav-cell" onclick="location.href=\'./activity.html\'"><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 2l2.4 5.9 6.4.5-4.9 4.2 1.5 6.3L12 15.8 6.6 18.9l1.5-6.3L3.2 8.4l6.4-.5z"/></svg></div><div class="tx">活动</div></div>' +
      (isAdmin ? '<div class="nav-cell" onclick="location.href=\'./profile.html?view=shopadmin\'"><div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div><div class="tx">商店管理</div></div>' : '') +
      '<div class="nav-cell" onclick="installPWA()"><div class="ic"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></div><div class="tx">安装到桌面</div></div>' +
      (viewingUser.phone && !viewingUser.custom_uid ? '<div class="nav-cell" onclick="location.href=\'./set-uid.html\'"><div class="ic" style="background:#ffebee;color:#e57373;border:2px solid #e57373;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M12 11v6"/><path d="M9 14h6"/></svg></div><div class="tx" style="color:#e57373;font-weight:700;">更换手机号</div></div>' : '') +
      '</div>';
  }

  var postsHtml = '<div class="tabs"><button class="tab active">' + (isSelf ? '我的帖子' : '他的帖子') + ' (' + myPosts.length + ')</button></div>';
  if (myPosts.length) {
    postsHtml += myPosts.map(function(p){
      return '<div class="post-card" onclick="goPost(\'' + p.id + '\')">' +
        (p.title ? '<div class="post-title">' + escapeHtml(p.title) + '</div>' : '') +
        '<div class="post-body">' + escapeHtml(String(p.content||'').replace(/<[^>]*>/g,'').substring(0,120)) + '</div>' +
        '<div class="post-foot"><span>' + new Date(p.created_at).toLocaleDateString('zh-CN') + '</span></div></div>';
    }).join('');
  } else {
    postsHtml += '<div class="empty">还没有发过帖子</div>';
  }

  $('pageContent').innerHTML = hero + navHtml + postsHtml;
}

function goPost(id){ location.href = './posts.html?post=' + id; }
window.goPost = goPost;
async function toggleFollow(){
  if (isSelf) return;
  try{
    if (iFollowed) {
      await window.sb.from('follows').delete().eq('follower_id', currentUser.id).eq('following_id', viewingUser.id);
      iFollowed = false;
      showToast('已取消关注');
    } else {
      await window.sb.from('follows').insert([{ follower_id: currentUser.id, following_id: viewingUser.id }]);
      iFollowed = true;
      showToast('已关注');
    }
    await render();
  }catch(e){ showToast('操作失败：' + e.message); }
}

function openEdit(){
  var u = viewingUser;
  $('editNickname').value = u.nickname || '';
  $('editBio').value = u.bio || '';
  $('editGender').value = u.gender || '';
  $('editBirthday').value = u.birthday || '';
  var av = $('editAvatar');
  if (u.avatar_url && String(u.avatar_url).indexOf('http') === 0) {
    av.style.backgroundImage = 'url(' + u.avatar_url + ')'; av.textContent = '';
  } else {
    av.style.backgroundImage = ''; av.textContent = String(u.nickname||'U').charAt(0).toUpperCase();
  }
  $('editModal').classList.add('active');
}
function closeEdit(){ $('editModal').classList.remove('active'); }
window.openEdit = openEdit; window.closeEdit = closeEdit; window.toggleFollow = toggleFollow;

async function saveProfile(){
  var patch = {
    nickname: $('editNickname').value.trim(),
    bio: $('editBio').value.trim(),
    gender: $('editGender').value,
    birthday: $('editBirthday').value || null
  };
  if (!patch.nickname) return showToast('昵称不能为空');
  try{
    await window.sb.from('users').update(patch).eq('id', currentUser.id);
    var u = getSessionUser() || {};
    u.nickname = patch.nickname; u.bio = patch.bio; u.gender = patch.gender; u.birthday = patch.birthday;
    setSessionUser(u);
    currentUser = u;
    showToast('已保存');
    closeEdit();
    await render();
  }catch(e){ showToast('保存失败：' + e.message); }
}
window.saveProfile = saveProfile;

function showConfirm(title, body, onOk) {
  var m = document.getElementById('confirmModal');
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmBody').textContent = body;
  m.classList.add('active');
  var cancel = document.getElementById('confirmCancel');
  var ok = document.getElementById('confirmOk');
  var cleanup = function() { m.classList.remove('active'); cancel.onclick = null; ok.onclick = null; };
  cancel.onclick = cleanup;
  ok.onclick = function() { if (onOk) onOk(); cleanup(); };
}

async function doLogout(){
  if (typeof showConfirm === 'function') {
    showConfirm('退出登录', '确定要退出登录吗？', async function(){
      await clearSession();
      location.href = './index.html';
    });
  } else {
    if(confirm('确定要退出登录吗？')){
      await clearSession();
      location.href = './index.html';
    }
  }
}
window.doLogout = doLogout;

document.getElementById('editAvatarInput').onchange = async function(e){
  var file = e.target.files[0]; if (!file) return;
  if (file.size > 5*1024*1024) { showToast('图片不能超过 5MB'); this.value=''; return; }
  try{
    showToast('上传中...');
    var ext = (file.name.split('.').pop() || 'png').toLowerCase();
    var path = currentUser.id + '/profile_' + Date.now() + '.' + ext;
    var up = await window.sb.storage.from('avatars').upload(path, file, { contentType: file.type, upsert: false });
    if (up.error) throw up.error;
    var url = window.sb.storage.from('avatars').getPublicUrl(path).data.publicUrl;
    await window.sb.from('users').update({ avatar_url: url }).eq('id', currentUser.id);
    var u = getSessionUser() || {}; u.avatar_url = url; setSessionUser(u); currentUser = u;
    viewingUser.avatar_url = url;
    var av = $('editAvatar'); av.style.backgroundImage = 'url(' + url + ')'; av.textContent = '';
    showToast('头像已更新');
    await render();
  }catch(err){ showToast('上传失败：' + err.message); }
};

(async function init(){
  // 顶部头部
  var hc = document.getElementById("header-container");
  hc.innerHTML = '<div class="app-header">' +
    '<div class="brand" onclick="location.href=\'./posts.html\'">Seven<span>戚</span><small> · 用户主页</small></div>' +
    '<div class="header-right">' +
      '<div class="user-area" onclick="location.href=\'./user.html\'">' +
        '<div class="avatar" id="headerAvatar" style="' + (currentUser.avatar_url && currentUser.avatar_url.indexOf('http')===0 ? 'background-image:url('+currentUser.avatar_url+')' : '') + '">' + (currentUser.avatar_url ? '' : (currentUser.nickname||'U').charAt(0).toUpperCase()) + '</div>' +
        '<span class="user-name">' + (currentUser.nickname || '用户') + '</span>' +
        '<span class="chevron">▾</span>' +
      '</div>' +
    '</div>' +
  '</div>';

  await render();
  
  // 如果是看别人的主页，就把底部导航隐藏掉
  if (!isSelf) {
    document.getElementById("footer-container").style.display = "none";
    // 顶部替换成返回按钮
    hc.innerHTML = '<div class="app-header" style="justify-content:flex-start;">' +
      '<button onclick="history.back()" style="background:none;border:none;cursor:pointer;padding:6px;color:var(--text);display:flex;border-radius:8px;">' +
      '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>' +
      '</button></div>';
  }
})();
</script>
